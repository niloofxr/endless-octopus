<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Octo Drift</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center; overflow: hidden;
      font-family: ui-rounded, "Nunito", "Arial Rounded MT Bold", system-ui, sans-serif;
      background: radial-gradient(circle at 50% -20%, #1d7192 0, #0c3959 45%, #061a37 100%);
    }
    .game-shell { position: relative; width: min(100vw, 520px); height: min(100vh, 800px); overflow: hidden; box-shadow: 0 24px 80px #001224aa; background: #0a5275; }
    canvas { width: 100%; height: 100%; display:block; }
    .hud { position:absolute; inset:0; pointer-events:none; padding: 18px 23px; }
    .title { text-align:center; text-transform:uppercase; font-size:clamp(16px, 4vw, 21px); font-weight:1000; letter-spacing:.13em; color:#f8d7ff; text-shadow:0 2px #7f3a9a,0 4px 8px #00263fcc; }
    .score { margin-top:7px; text-align:center; font-size:clamp(42px, 8vw, 62px); font-weight:900; line-height:1; color:#fff8db; text-shadow: 0 4px 0 #0d4563, 0 7px 18px #00263fcc; }
    .best { position:absolute; right:20px; top:22px; font-weight:800; font-size:13px; color:#d5f5f7; background:#0845649c; padding:8px 10px; border-radius:100px; letter-spacing:.04em; }
    .panel { position:absolute; inset:0; display:grid; place-items:center; padding:30px; text-align:center; transition: opacity .2s; }
    .card { width:min(100%, 350px); padding:28px 24px 23px; border:2px solid #91e0df88; border-radius:26px; background:linear-gradient(145deg,#073e64e8,#08284fe8); box-shadow: inset 0 1px #ffffff44, 0 15px 40px #002544b5; }
    .logo { margin:0; font-size:clamp(42px,10vw,58px); line-height:.88; letter-spacing:-.06em; color:#f6d6ff; text-shadow:0 4px #8a429b, 0 7px 0 #122f6c; }
    .tag { margin:14px 0 22px; color:#bcebf0; font-size:15px; line-height:1.5; }
    button { cursor:pointer; border:0; border-radius:14px; padding:14px 24px; min-width:185px; color:#083354; background:linear-gradient(#ffe477,#ffba45); box-shadow:inset 0 2px #fff5a9, 0 5px #a84f26; font:900 16px inherit; letter-spacing:.02em; transition:transform .12s; }
    button:hover { transform: translateY(-2px); } button:active { transform:translateY(2px); }
    .hint { margin:18px 0 0; color:#84cbd4; font-size:12px; font-weight:700; letter-spacing:.03em; }
    .hidden { opacity:0; visibility:hidden; }
    .game-over-title { font-size:35px; margin-bottom:7px; }
    .run-score { color:#fff3be; font-weight:900; font-size:21px; margin:0 0 21px; }
    @media (max-width:520px) { .game-shell { width:100vw; height:100vh; } }
  </style>
</head>
<body>
  <main class="game-shell" aria-label="Octo Drift game">
    <canvas id="game" width="520" height="800"></canvas>
    <div class="hud"><div class="title">Endless Octopus</div><div class="score" id="score">0</div><div class="best">BEST <span id="best">0</span></div></div>
    <div class="panel" id="startPanel"><section class="card"><h1 class="logo">OCTO<br>DRIFT</h1><p class="tag">Guide Ollie through the deep.<br>Avoid reef rocks, seaweed, and wreckage.</p><button id="startButton">START SWIMMING</button><p class="hint">SPACE · CLICK · TAP TO SWIM</p></section></div>
    <div class="panel hidden" id="overPanel"><section class="card"><h2 class="logo game-over-title">OCTO DOWN!</h2><p class="run-score">You drifted <span id="finalScore">0</span> fathoms</p><button id="againButton">DIVE AGAIN</button><p class="hint">SPACE · CLICK · TAP TO SWIM</p></section></div>
  </main>
  <script>
    const canvas = document.getElementById('game'), ctx = canvas.getContext('2d');
    const W=520,H=800, floor=62, octo={x:145,y:350,r:24,vy:0,tilt:0,swim:0};
    const startPanel=document.getElementById('startPanel'), overPanel=document.getElementById('overPanel');
    const scoreEl=document.getElementById('score'), bestEl=document.getElementById('best'), finalEl=document.getElementById('finalScore');
    let state='ready', score=0, best=+localStorage.getItem('octo-best')||0, obstacles=[], bubbles=[], last=0, spawn=0, animation, audioContext;
    const seaLife=[{x:430,y:158,s:.42,c:'#ffd36c',phase:0},{x:80,y:250,s:.28,c:'#ff9c73',phase:2.2},{x:340,y:430,s:.34,c:'#8ee1e8',phase:4.1},{x:455,y:565,s:.25,c:'#ffd36c',phase:5.3}];
    bestEl.textContent=best;
    for(let i=0;i<42;i++) bubbles.push({x:Math.random()*W,y:Math.random()*H,r:1+Math.random()*4,s:.15+Math.random()*.55,a:.12+Math.random()*.32});
    function unlockAudio(){if(!audioContext){audioContext=new (window.AudioContext||window.webkitAudioContext)()}if(audioContext.state==='suspended')audioContext.resume();}
    function playSplash(){
      if(!audioContext||audioContext.state!=='running')return;
      const now=audioContext.currentTime, duration=.48, length=Math.floor(audioContext.sampleRate*duration), buffer=audioContext.createBuffer(1,length,audioContext.sampleRate), data=buffer.getChannelData(0);let last=0;
      // Slow, correlated noise becomes a thick watery swish instead of a windy hiss.
      for(let i=0;i<length;i++){last=last*.91+(Math.random()*2-1)*.12;data[i]=last;}
      const source=audioContext.createBufferSource(), filter=audioContext.createBiquadFilter(), gain=audioContext.createGain();
      source.buffer=buffer;filter.type='bandpass';filter.Q.value=.7;
      // The moving filter and two volume crests create the sensation of water circling a cup.
      filter.frequency.setValueAtTime(340,now);filter.frequency.exponentialRampToValueAtTime(1500,now+.15);filter.frequency.exponentialRampToValueAtTime(420,now+.31);filter.frequency.exponentialRampToValueAtTime(1050,now+duration);
      gain.gain.setValueAtTime(.001,now);gain.gain.exponentialRampToValueAtTime(.24,now+.07);gain.gain.exponentialRampToValueAtTime(.07,now+.22);gain.gain.exponentialRampToValueAtTime(.19,now+.34);gain.gain.exponentialRampToValueAtTime(.001,now+duration);
      source.connect(filter).connect(gain).connect(audioContext.destination);source.start(now);
    }
    function rounded(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill();}
    function drawBackground(t){
      const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#177b95');g.addColorStop(.5,'#075575');g.addColorStop(1,'#042c54');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
      ctx.globalAlpha=.12; ctx.fillStyle='#b5f7eb'; for(let i=0;i<5;i++){ctx.beginPath();ctx.moveTo(35+i*115,-10);ctx.lineTo(95+i*115,-10);ctx.lineTo(155+i*105,H);ctx.lineTo(105+i*88,H);ctx.closePath();ctx.fill();}ctx.globalAlpha=1;
      bubbles.forEach(b=>{b.y-=b.s; if(b.y<-10){b.y=H+10;b.x=Math.random()*W} ctx.globalAlpha=b.a;ctx.fillStyle='#d9ffff';ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,7);ctx.fill();});ctx.globalAlpha=1;
      // Gentle schools of fish travel through the distant water.
      seaLife.forEach(f=>{f.x-=f.s;if(f.x<-35)f.x=W+35;let y=f.y+Math.sin(t/650+f.phase)*9;ctx.save();ctx.translate(f.x,y);ctx.globalAlpha=.78;ctx.fillStyle=f.c;ctx.beginPath();ctx.ellipse(0,0,12,6,0,0,7);ctx.fill();ctx.beginPath();ctx.moveTo(10,0);ctx.lineTo(20,-9);ctx.lineTo(20,9);ctx.closePath();ctx.fill();ctx.fillStyle='#123c5d';ctx.beginPath();ctx.arc(-5,-1.5,1.4,0,7);ctx.fill();ctx.restore();});
      ctx.fillStyle='#073750';ctx.beginPath();ctx.moveTo(0,H-floor);for(let x=0;x<=W;x+=28)ctx.lineTo(x,H-floor-8-Math.sin(x*.07)*7);ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.fill();
      for(let x=15;x<W;x+=45){ctx.strokeStyle='#126675';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(x,H-floor+5);ctx.quadraticCurveTo(x-9,H-floor-27,x+2,H-floor-50);ctx.stroke();}
      // Pebbles, coral and grass give the distant seabed depth.
      for(let x=12;x<W;x+=31){ctx.fillStyle=x%3?'#0f5365':'#287a79';ctx.beginPath();ctx.ellipse(x,H-floor+2,5+(x%7),3,0,0,7);ctx.fill();}
      [[53,'#ee786f'],[319,'#f39d72'],[460,'#ce6a98']].forEach(([x,c],n)=>{ctx.strokeStyle=c;ctx.lineWidth=6;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x,H-floor+3);ctx.quadraticCurveTo(x-6,H-floor-23,x+(n-1)*12,H-floor-31);ctx.moveTo(x,H-floor-13);ctx.lineTo(x-9,H-floor-22);ctx.moveTo(x+1,H-floor-18);ctx.lineTo(x+10,H-floor-27);ctx.stroke();});
    }
    function drawOctopus(){
      const time=performance.now()/1000, stroke=Math.max(0,octo.swim), pulse=Math.sin(Math.min(1,stroke)*Math.PI), idle=Math.sin(time*4)*.6;
      ctx.save();ctx.translate(octo.x,octo.y);ctx.rotate(octo.tilt);ctx.scale(1+pulse*.09,1-pulse*.06);
      // Eight independently waving tentacles: the swim pulse makes them sweep backward together.
      for(let i=0;i<8;i++){
        const a=-2.55+i*.45, baseX=Math.cos(a)*16, baseY=16+Math.sin(a)*5;
        const bend=(i-3.5)*3 + Math.sin(time*5+i*1.8)*5 - pulse*18;
        ctx.strokeStyle='#71358f';ctx.lineWidth=10;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(baseX,baseY);
        ctx.bezierCurveTo(baseX+Math.cos(a)*13+bend*.25,baseY+16,baseX+Math.cos(a)*25+bend,37+Math.sin(time*5+i)*4,baseX+Math.cos(a)*34+bend*1.25,48-pulse*9);ctx.stroke();
        ctx.strokeStyle='#d17bdf';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(baseX+1,baseY+2);ctx.bezierCurveTo(baseX+Math.cos(a)*13+bend*.25,baseY+16,baseX+Math.cos(a)*25+bend,37+Math.sin(time*5+i)*4,baseX+Math.cos(a)*34+bend*1.25,48-pulse*9);ctx.stroke();
        // tiny suction cups underneath each arm
        ctx.fillStyle='#f1a6ef';for(let c=1;c<3;c++){let p=c/3;ctx.beginPath();ctx.arc(baseX+(Math.cos(a)*31+bend*1.15)*p,baseY+(43-pulse*8)*p,1.7,0,7);ctx.fill();}
      }
      const body=ctx.createRadialGradient(-8,-15,3,0,0,30);body.addColorStop(0,'#eea4ed');body.addColorStop(.34,'#cd6fda');body.addColorStop(1,'#8c3dab');ctx.fillStyle=body;ctx.beginPath();ctx.ellipse(0,-3,27,29,0,0,7);ctx.fill();ctx.strokeStyle='#f6b8f1';ctx.lineWidth=2;ctx.stroke();
      // Head speckles and shine lend the character a little more texture.
      ctx.fillStyle='#f4b7ef';[[ -15,-20,2],[ -7,-25,1.5],[11,-22,2],[18,-13,1.3],[-19,-10,1.2]].forEach(p=>{ctx.beginPath();ctx.arc(...p,0,7);ctx.fill()});
      ctx.globalAlpha=.35;ctx.fillStyle='#fff';ctx.beginPath();ctx.ellipse(-11,-16,7,11,-.45,0,7);ctx.fill();ctx.globalAlpha=1;
      ctx.fillStyle='#fff';ctx.beginPath();ctx.ellipse(-9,-8+idle*.15,8.5,10.5,0,0,7);ctx.ellipse(10,-8+idle*.15,8.5,10.5,0,0,7);ctx.fill();
      ctx.fillStyle='#173854';ctx.beginPath();ctx.arc(-7,-7+idle*.15,3.5,0,7);ctx.arc(12,-7+idle*.15,3.5,0,7);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(-6,-8,1,0,7);ctx.arc(13,-8,1,0,7);ctx.fill();
      ctx.strokeStyle='#653077';ctx.lineWidth=2.3;ctx.beginPath();ctx.moveTo(-15,-20);ctx.quadraticCurveTo(-9,-23,-4,-20);ctx.moveTo(5,-20);ctx.quadraticCurveTo(11,-23,16,-19);ctx.moveTo(-6,7);ctx.quadraticCurveTo(1,13,9,6);ctx.stroke();ctx.restore();
    }
    function drawRock(x,y,w,h,flip){ctx.save();ctx.translate(x,y);if(flip){ctx.translate(0,h);ctx.scale(1,-1)}const rg=ctx.createLinearGradient(0,0,w,h);rg.addColorStop(0,'#91a2ae');rg.addColorStop(1,'#35495f');ctx.fillStyle=rg;ctx.beginPath();ctx.moveTo(0,h);ctx.lineTo(3,h*.35);ctx.lineTo(w*.28,h*.08);ctx.lineTo(w*.7,0);ctx.lineTo(w,h*.32);ctx.lineTo(w,h);ctx.closePath();ctx.fill();ctx.strokeStyle='#b7cdd1';ctx.lineWidth=3;ctx.stroke();ctx.strokeStyle='#3d5268';ctx.lineWidth=2;for(let i=1;i<4;i++){ctx.beginPath();ctx.moveTo(4,h*(.23+i*.17));ctx.lineTo(w-5,h*(.1+i*.18));ctx.stroke();}ctx.fillStyle='#264d55';[[.22,.35,5],[.7,.5,4],[.42,.72,3]].forEach(p=>{ctx.beginPath();ctx.arc(w*p[0],h*p[1],p[2],0,7);ctx.fill()});ctx.fillStyle='#5bb98f';ctx.beginPath();ctx.arc(w*.16,h*.79,8,0,7);ctx.arc(w*.84,h*.25,5,0,7);ctx.fill();ctx.restore();}
    function drawSeaweed(x,y,w,h,flip){const time=performance.now()/430;ctx.save();ctx.translate(x,y);if(flip){ctx.translate(0,h);ctx.scale(1,-1)}for(let i=0;i<6;i++){let bx=(i+.5)*w/6, sway=Math.sin(time+i*1.4)*9;ctx.strokeStyle=i%2?'#1b8c6a':'#127a62';ctx.lineWidth=9;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(bx,h);ctx.bezierCurveTo(bx-14+sway*.15,h*.72,bx+18+sway*.55,h*.37,bx+sway,0);ctx.stroke();ctx.strokeStyle='#63d599';ctx.lineWidth=1.8;ctx.beginPath();ctx.moveTo(bx,h);ctx.bezierCurveTo(bx-14+sway*.15,h*.72,bx+18+sway*.55,h*.37,bx+sway,0);ctx.stroke();}ctx.fillStyle='#44b985';for(let i=0;i<4;i++){ctx.beginPath();ctx.arc(12+i*w/4,h-7,4,0,7);ctx.fill()}ctx.restore();}
    function drawWreck(x,y,w,h,flip){ctx.save();ctx.translate(x,y);if(flip){ctx.translate(0,h);ctx.scale(1,-1)}const wood=ctx.createLinearGradient(0,0,w,h);wood.addColorStop(0,'#c1834d');wood.addColorStop(1,'#593c35');ctx.fillStyle=wood;ctx.beginPath();ctx.moveTo(0,h);ctx.lineTo(6,h*.22);ctx.lineTo(w*.8,0);ctx.lineTo(w,h*.18);ctx.lineTo(w,h);ctx.closePath();ctx.fill();ctx.strokeStyle='#e4ad68';ctx.lineWidth=4;for(let i=1;i<4;i++){ctx.beginPath();ctx.moveTo(i*w/4,h);ctx.lineTo(i*w/4+10,h*.15);ctx.stroke()}ctx.strokeStyle='#4a322e';ctx.lineWidth=3;for(let j=1;j<4;j++){ctx.beginPath();ctx.moveTo(0,h*j/4);ctx.lineTo(w,h*(j/4-.15));ctx.stroke();}ctx.fillStyle='#263c48';ctx.beginPath();ctx.arc(w*.7,h*.48,9,0,7);ctx.fill();ctx.strokeStyle='#d7a85f';ctx.lineWidth=3;ctx.stroke();ctx.fillStyle='#278969';ctx.beginPath();ctx.arc(w*.18,h*.24,7,0,7);ctx.arc(w*.48,h*.81,6,0,7);ctx.fill();ctx.restore();}
    function drawObstacle(o){let draw=o.type===0?drawRock:o.type===1?drawSeaweed:drawWreck;draw(o.x,0,o.w,o.top,true);draw(o.x,H-floor-o.bottom,o.w,o.bottom,false);}
    function addObstacle(){let gap=Math.max(170,215-score*1.5), center=190+Math.random()*(H-floor-380), top=center-gap/2, bottom=H-floor-(center+gap/2);obstacles.push({x:W+35,w:76+Math.random()*26,top,bottom,type:Math.floor(Math.random()*3),scored:false});}
    function collide(o){let cx=Math.max(o.x,Math.min(octo.x,o.x+o.w)), hitX=(octo.x-cx)**2<octo.r**2;return hitX&&(octo.y-octo.r<o.top||octo.y+octo.r>H-floor-o.bottom);}
    function reset(){score=0;obstacles=[];spawn=0;octo.y=350;octo.vy=0;octo.swim=0;scoreEl.textContent=0;}
    function start(){reset();state='playing';startPanel.classList.add('hidden');overPanel.classList.add('hidden');}
    function flap(){unlockAudio();if(state==='ready')start();if(state==='over'){start();}octo.vy=-7.2;octo.swim=1;}
    function end(){state='over';best=Math.max(best,score);localStorage.setItem('octo-best',best);bestEl.textContent=best;finalEl.textContent=score;overPanel.classList.remove('hidden');}
    function update(t){let dt=Math.min((t-last)/16.67,2);last=t;octo.swim=Math.max(0,octo.swim-.08*dt);drawBackground(t);if(state==='playing'){octo.vy+=.42*dt;octo.y+=octo.vy*dt;octo.tilt=Math.max(-.4,Math.min(.65,octo.vy*.07));spawn+=dt;if(spawn>92){addObstacle();spawn=0}obstacles.forEach(o=>{o.x-=3.05*dt;if(!o.scored&&o.x+o.w<octo.x){o.scored=true;score++;scoreEl.textContent=score;playSplash()}drawObstacle(o);if(collide(o))end();});obstacles=obstacles.filter(o=>o.x+o.w>-10);if(octo.y-octo.r<0||octo.y+octo.r>H-floor)end();}else{obstacles.forEach(drawObstacle);octo.tilt=Math.sin(t/500)*.08;octo.y=350+Math.sin(t/650)*8;}drawOctopus();animation=requestAnimationFrame(update);}
    document.getElementById('startButton').onclick=start;document.getElementById('againButton').onclick=start;canvas.addEventListener('pointerdown',flap);window.addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault();flap()}});requestAnimationFrame(update);
  </script>
</body>
</html>
